services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loaded
      POSTGRES_PASSWORD: loaded
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loaded"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ../services/auth-service
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/auth_db
      CORS_ALLOWED_ORIGINS: ""
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8001:8000"

  workout-service:
    build: ../services/workout-service
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/workout_db
      CORS_ALLOWED_ORIGINS: ""
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8002:8000"

  workout-service-events:
    build: ../services/workout-service
    command: python manage.py listen_for_events
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/workout_db
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  analytics-service:
    build: ../services/analytics-service
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/analytics_db
      CORS_ALLOWED_ORIGINS: ""
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8003:8000"

  analytics-service-events:
    build: ../services/analytics-service
    command: python manage.py listen_for_events
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/analytics_db
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    build: ../services/notification-service
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/notif_db
      CORS_ALLOWED_ORIGINS: ""
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8004:8000"

  notification-service-events:
    build: ../services/notification-service
    command: python manage.py listen_for_events
    environment:
      SECRET_KEY: dev-only-change-before-deploy
      DATABASE_URL: postgres://loaded:loaded@postgres:5432/notif_db
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: loaded-auth-service
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./dev-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ../gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000" # API traffic goes through here — the app should point at this in later phases
      - "8081:8001" # Kong admin API — local/dev only, never expose publicly
    depends_on:
      - auth-service
      - workout-service
      - analytics-service
      - notification-service

volumes:
  postgres-data:

name: Build and deploy

# Runs whenever code lands on v1 (the branch the production server tracks).
# Builds each service's Docker image on GitHub's own runners (not the tiny
# EC2 box — this is specifically to stop disk space filling up during builds,
# which has happened repeatedly building directly on the server), pushes the
# finished images to GitHub Container Registry, then tells the server to
# pull the new images and restart — no building on the server at all.

on:
  push:
    branches: [v1]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/workout-appilcation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, workout-service, analytics-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/loadded-app
            git pull origin v1
            cd infra
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
